
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="t d">
  <title id="t">Abhijeet — Cybersecurity Profile</title>
  <desc id="d">A dark cybersecurity banner with electric blue and crimson accents, network-inspired lines, and an AB emblem.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b16"/>
      <stop offset="1" stop-color="#111a31"/>
    </linearGradient>

    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#247bff"/>
      <stop offset="1" stop-color="#ff354f"/>
    </linearGradient>

    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#8aa4d7" opacity=".18"/>
    </pattern>

    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1000" height="330" rx="24" fill="url(#bg)"/>
  <rect width="1000" height="330" rx="24" fill="url(#dots)"/>

  <path d="M0 280 L300 210 L550 270 L1000 115"
        fill="none" stroke="#247bff" stroke-opacity=".18" stroke-width="2"/>
  <path d="M0 302 L340 232 L570 286 L1000 142"
        fill="none" stroke="#ff354f" stroke-opacity=".18" stroke-width="2"/>

  <rect x="28" y="28" width="5" height="270" rx="3" fill="url(#line)"/>

  <text x="60" y="65" font-family="monospace" font-size="15"
        letter-spacing="3" fill="#72aaff">SECURITY • NETWORKS • DIGITAL FORENSICS</text>

  <text x="58" y="142" font-family="Arial, Helvetica, sans-serif"
        font-size="54" font-weight="800" fill="#f4f7ff">Hi, I'm Abhijeet</text>

  <text x="61" y="185" font-family="Arial, Helvetica, sans-serif"
        font-size="25" font-weight="600" fill="#4d9aff">Cybersecurity Student</text>

  <text x="61" y="222" font-family="Arial, Helvetica, sans-serif"
        font-size="17" fill="#c7d2e8">Learning security through hands-on labs and practical projects.</text>

  <g transform="translate(805 162)" filter="url(#glow)">
    <circle r="88" fill="#0b1428" stroke="#247bff" stroke-width="2"/>
    <circle r="72" fill="none" stroke="#ff354f"
            stroke-width="1.5" stroke-dasharray="8 9"/>

    <path d="M-35 -23 L-12 -43 L12 -43 L35 -23 L35 18 L12 40 L-12 40 L-35 18 Z"
          fill="#111e39" stroke="#6aa7ff" stroke-width="2"/>

    <text x="0" y="11" text-anchor="middle" font-family="monospace"
          font-size="35" font-weight="700" fill="#f4f7ff">AB</text>

    <circle cx="0" cy="-61" r="4" fill="#ff354f"/>
    <circle cx="62" cy="20" r="4" fill="#247bff"/>
  </g>

  <rect x="60" y="264" width="220" height="34" rx="17"
        fill="#122341" stroke="#247bff" stroke-opacity=".65"/>

  <text x="170" y="286" text-anchor="middle" font-family="monospace"
        font-size="13" fill="#dce9ff">GUJARAT, INDIA</text>
</svg>
